# The checks every change runs, as AGENTS.md lists them, on Linux and macOS:
# what is pushed to main, and pull requests into it. A release tag has its
# own workflow, which runs them again.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o rumbo ./cmd/rumbo
      - name: Evaluation tasks are sound
        run: go run ./evals -selftest
